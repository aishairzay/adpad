    <script>
      /* Hold the window load event until the first data reads finish, so nothing is cut off mid-load. */
      (function () {
        document.documentElement.classList.add('adpad-holding');
        var w = window, pending = 0, quietSince = 0, done = false, start = Date.now();
        var f = document.createElement('iframe');
        f.setAttribute('aria-hidden', 'true');
        f.tabIndex = -1;
        f.style.cssText = 'display:none';
        document.body.appendChild(f);
        var d = f.contentDocument;
        try { d.open(); d.write(''); } catch (e) { d = null; }
        function release() {
          if (done) return;
          done = true;
          try { if (d) d.close(); } catch (e) {}
          setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 0);
        }
        function reveal() {
          document.documentElement.classList.remove('adpad-holding');
          var b = document.getElementById('boot-shell');
          if (b && b.parentNode) b.parentNode.removeChild(b);
        }
        w.addEventListener('load', reveal);
        setTimeout(reveal, 9000);
        w.__adpadReleaseLoad = function () { release(); reveal(); };
        function begin() { pending++; quietSince = 0; }
        function end() { pending = Math.max(0, pending - 1); }
        var of = w.fetch;
        if (of) w.fetch = function () {
          begin();
          return of.apply(this, arguments).then(function (r) { end(); return r; }, function (e) { end(); throw e; });
        };
        var X = w.XMLHttpRequest && w.XMLHttpRequest.prototype;
        if (X) {
          var os = X.send;
          X.send = function () {
            if (!done) { begin(); this.addEventListener('loadend', end, { once: true }); }
            return os.apply(this, arguments);
          };
        }
        var t = setInterval(function () {
          if (done) return clearInterval(t);
          if (Date.now() - start > 7000) { clearInterval(t); return release(); }
          if (!w.__adpadMounted || pending > 0) { quietSince = 0; return; }
          if (!quietSince) quietSince = Date.now();
          else if (Date.now() - quietSince >= 300) { clearInterval(t); release(); }
        }, 50);
      })();
    </script>
